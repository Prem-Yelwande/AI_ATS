[project]
name = "application-tracking-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "alembic",
    "python-multipart",
    "jinja2",
    "pymupdf",
    "python-docx",
    "langchain>=1.3.18",
    "langgraph>=1.2.11",
    "langchain-mistralai>=1.1.6",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "pydantic>=2.13.5",
    "langchain-community>=0.4.2",
    "docx2txt>=0.9",
    "pandas>=3.0.5",
    "pypdf>=6.16.2",
    "langchain-groq>=1.1.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-google-genai>=4.4.0",
]

[project.scripts]
application-tracking-system = "application_tracking_system:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
